name: Build and verify

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'CONTRIBUTING.md', 'SECURITY.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mksh gcc qemu-user dosfstools
          python -m pip install -r tools/ci-requirements.txt
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "GEN5W_CLANG=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" >> "$GITHUB_ENV"
      - name: Build all packages once
        run: bash tools/build-all.sh
      - name: Built scripts use only head-unit commands
        run: python tests/unit_commands.py --dist
      - name: Run combined verification once
        run: |
          sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "GEN5W_CLANG=$GEN5W_CLANG" bash tests/run.sh
          python tests/audio.py
          python tests/audio_native.py
          python tests/audio_arm.py
          python tests/audio_arm.py --profile tools/audio/recipe-v039gl3.json --helper packages/audio-format/bin/audio-patch-v039gl3
          python tools/audit-artifacts.py dist
      - name: Save integrated installer and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gen5w-kr-integrated-${{ github.sha }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/MD5SUMS
          if-no-files-found: error
          retention-days: 14
